<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Discord Token Login</title>
  <style>
    /* Basic styling for the popup */
    body {
      font-family: 'Whitney', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background-color: #2f3136;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      width: 260px;
      box-sizing: border-box;
    }
    .header {
      text-align: center;
      font-size: 20px;
      margin-bottom: 20px;
    }
    .input-container {
      margin-bottom: 10px;
    }
    label {
      font-size: 14px;
      color: #b9bbbe;
      margin-bottom: 5px;
      display: block;
    }
    input[type="password"] {
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #202225;
      background-color: #202225;
      color: #ffffff;
      box-sizing: border-box;
    }
    .button {
      background-color: #7289da;
      color: white;
      border: none;
      padding: 10px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 10px;
    }
    .button:hover {
      background-color: #5b6eae;
    }
    .footer {
      text-align: center;
      font-size: 12px;
      color: #b9bbbe;
      margin-top: 20px;
    }
    .footer a {
      color: #7289da;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }

    /* Message shown when not on the Discord login page */
    .message {
      font-size: 14px;
      color: #b9bbbe;
      margin-bottom: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="header" class="header"></div>
  <!-- Status message to inform the user when the active tab is not the Discord login page -->
  <div id="message" class="message"></div>
  <!-- Button to navigate directly to the Discord login page -->
  <button id="goto-button" class="button">Go to Discord Login</button>
  <!-- Token input and login area -->
  <div class="input-container">
    <label id="token-label" for="token-input"></label>
    <input type="password" id="token-input" placeholder="Enter your token here">
  </div>
  <button id="token-login-button" class="button">Login with Token</button>
  <div id="footer" class="footer"></div>
  <script src="popup.js"></script>
</body>
</html>
